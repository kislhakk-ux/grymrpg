<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#06080e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Energy Halo / Aura -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="12 12" opacity="0.6" filter="url(#glow)"/>

  <!-- Crossed Dumbbells / Weapons -->
  <g filter="url(#glow)">
    <!-- Barbell / Anvil Forge Emblem -->
    <!-- Center Anvil / Forge Crest -->
    <path d="M 170 320 L 342 320 L 310 380 L 202 380 Z" fill="url(#cyanGrad)"/>
    
    <!-- Dumbbell Bar -->
    <rect x="116" y="232" width="280" height="24" rx="12" fill="#e2e8f0"/>
    
    <!-- Left Plates -->
    <rect x="90" y="180" width="30" height="128" rx="10" fill="url(#goldGrad)"/>
    <rect x="130" y="196" width="22" height="96" rx="8" fill="url(#goldGrad)"/>
    <rect x="70" y="206" width="16" height="76" rx="6" fill="#f59e0b"/>

    <!-- Right Plates -->
    <rect x="392" y="180" width="30" height="128" rx="10" fill="url(#goldGrad)"/>
    <rect x="360" y="196" width="22" height="96" rx="8" fill="url(#goldGrad)"/>
    <rect x="426" y="206" width="16" height="76" rx="6" fill="#f59e0b"/>

    <!-- Sword Blade / Flame Rising Through Center -->
    <path d="M 256 100 L 280 200 L 256 220 L 232 200 Z" fill="url(#goldGrad)"/>
    <polygon points="256,70 270,110 242,110" fill="#fef08a"/>
    <circle cx="256" cy="244" r="18" fill="#06b6d4" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
