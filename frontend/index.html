<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GymForge — Academia RPG</title>
  <meta name="description" content="Aplicativo Fitness Gamificado Online. Evolua seu personagem na vida real com treinos, XP, níveis, atributos e inteligência artificial." />
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymForge" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />

  <!-- Google Fonts: Outfit, Inter, Cinzel (RPG), Rajdhani (HUD/Tech) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body class="bg-forge-950 text-slate-100 font-sans antialiased selection:bg-forge-gold selection:text-forge-950 min-h-screen flex flex-col overflow-x-hidden">
  
  <!-- Main Application Root -->
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <!-- Audio unlocker and App Scripts -->
  <script type="module" src="/src/main.js"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('🛡️ GymForge PWA Service Worker registrado com sucesso:', reg.scope))
          .catch((err) => console.log('⚠️ Falha ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
